name: Rewards Stock Checker

on:
  schedule:
    - cron: '*/10 * * * *'  # Runs every 10 minutes in the background
  workflow_dispatch:        # Allows manual trigger via "Run workflow" button

jobs:
  check-stock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Flipkart Gift Card Stock
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.CHAT_ID || secrets.TELEGRAM_CHAT }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python bing_flipkart_checker.py --once
